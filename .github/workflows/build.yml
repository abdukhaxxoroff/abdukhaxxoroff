name: Profile card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch stats and render SVGs
        env:
          # Add an ACCESS_TOKEN secret (classic PAT with repo + read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Render resume card
        run: python scripts/resume.py

      - name: Convert SVGs to animated WebP
        run: python scripts/convert.py

      - name: Generate contribution snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3fb950
            dist/snake-light.svg?palette=github-light&color_snake=#1a7f37

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.* light_mode.* resume_dark.* resume_light.* dist/
          git diff --cached --quiet || git commit -m "bot: update profile card $(date -u +%Y-%m-%d)"
          git push
